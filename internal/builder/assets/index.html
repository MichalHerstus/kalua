<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KALUA Form Builder</title>
<link rel="stylesheet" href="/static/builder.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">KALUA <span>Form Builder</span></div>
    <div id="fileinfo" class="fileinfo">
      <span id="path"></span>
      <span id="format" class="badge"></span>
    </div>
    <div class="actions">
      <button id="btn-new" title="Start a new form">New</button>
      <button id="btn-save" title="Save to the source file (Ctrl/Cmd+S)">Save</button>
      <button id="btn-export" title="Regenerate Lua source (download)">Export Lua</button>
      <button id="btn-validate" title="Run the KALUA static checker on the generated Lua">Validate</button>
    </div>
  </header>

  <section id="palette" aria-label="Control palette">
    <h2>Controls</h2>
    <ul id="palette-list"></ul>
    <div class="palette-footer">
      <button id="btn-add-control" title="Add the selected control type to the form">+ Add</button>
    </div>
  </section>

  <main id="canvas">
    <div id="canvas-head">
      <h1 id="form-title">Form</h1>
      <div id="canvas-tools">
        <span class="hint">Change a property → preview updates automatically</span>
      </div>
    </div>
    <div id="preview" class="preview"><p class="kalua-hint">Nothing loaded yet.</p></div>
  </main>

  <aside id="inspector" aria-label="Properties">
    <h2>Properties</h2>
    <details id="form-props" open>
      <summary>Form</summary>
      <div class="prop-grid">
        <label>Name <input id="f_name" type="text" data-kpath="name"></label>
        <label>Title <input id="f_title" type="text" data-kpath="title"></label>
        <label>Layout
          <select id="f_layout" data-kpath="layout">
            <option value="vertical">Vertical</option>
            <option value="grid">Grid</option>
          </select>
        </label>
        <label>Align
          <select id="f_align" data-kpath="align">
            <option value="left">Left</option>
            <option value="center">Center</option>
            <option value="right">Right</option>
          </select>
        </label>
        <label>Gap (px) <input id="f_gap" type="number" min="0" step="1" data-kpath="gap"></label>
      </div>
      <div class="cells-editor">
        <label class="cellrow"><span>Cells (grid)</span><select id="f_cellsel"></select></label>
        <div class="cellrow">
          <label>Width <input id="c_width" type="number" min="1" max="12" step="1"></label>
          <label>Bg <input id="c_bg" type="text" placeholder="#ffffff"></label>
        </div>
        <div class="cellrow">
          <label>Align
            <select id="c_align">
              <option value="">default</option>
              <option value="left">left</option>
              <option value="center">center</option>
              <option value="right">right</option>
            </select>
          </label>
          <button id="btn-add-cell" title="Add a new empty cell">+ Cell</button>
        </div>
      </div>
    </details>

    <details id="ctrl-props" open>
      <summary><span id="ctrl-head">Control</span> <span id="ctrl-type" class="badge"></span></summary>
      <div id="ctrl-editor" class="prop-grid">Select a control in the preview or the list below.</div>
    </details>

    <details id="ctrl-list" open>
      <summary>Controls</summary>
      <ul id="control-list"></ul>
    </details>
  </aside>

  <footer id="statusbar">
    <span id="notes" class="notes"></span>
    <span id="status"></span>
  </footer>
</div>
<div id="overlay" class="overlay hidden">
  <div class="modal">
    <button id="modal-close" class="modal-close" title="Close">×</button>
    <h3 id="modal-title"></h3>
    <pre id="modal-body"></pre>
  </div>
</div>
<script src="/static/builder.js"></script>
</body>
</html>
