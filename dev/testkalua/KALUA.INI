; KALUA testbed configuration (pwd = this directory).
; Precedence: CLI flags > KALUA.INI > env vars > built-in defaults.
; See ../../KALUA.ini.sample for the full annotated sample.

[RUN]
no-browser    = 1
port          = 9000
verbose       = 1
; test        = 1   ; headless test mode

[SERVE]
host    = 127.0.0.1
port    = 8080
workers = 4
mode    = http

[CHECK]
verbose = 1